<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Joanna Garland — schedule</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <a class="skip" href="#content">Skip to schedule</a>
    <header class="top">
      <div class="identity">
        <p class="eyebrow">Singles tracker</p>
        <h1>Joanna Garland</h1>
      </div>
      <div class="rank" id="rank-block" aria-live="polite"></div>
      <div class="actions">
        <p class="updated" id="updated">Loading schedule…</p>
        <p class="cadence">Updates once a day</p>
        <button type="button" class="update" id="refresh" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M20 12a8 8 0 1 1-2.2-5.5"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
            <path d="M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          Update
        </button>
      </div>
    </header>

    <nav class="views" aria-label="Sections">
      <button type="button" id="tab-schedule" aria-pressed="true">Schedule</button>
      <button type="button" id="tab-results" aria-pressed="false">Results</button>
    </nav>

    <main id="content">
      <section id="schedule-view" aria-labelledby="tab-schedule"></section>
      <section id="results-view" aria-labelledby="tab-results" hidden></section>
    </main>

    <section class="snapshot" id="snapshot" aria-label="Season snapshot"></section>

    <section class="news" id="news" aria-labelledby="news-title"></section>

    <section class="signup" id="alerts" aria-labelledby="alerts-title">
      <div>
        <h2 id="alerts-title">Get an email</h2>
        <p>One email the morning before she starts a tournament, and one email for each singles result.</p>
      </div>
      <form id="alert-form">
        <label class="email-label" for="alert-email">Email</label>
        <input id="alert-email" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com" />
        <fieldset>
          <legend>Send me</legend>
          <label><input type="checkbox" name="starts" /> When a tournament is about to start</label>
          <label><input type="checkbox" name="results" /> Each result</label>
        </fieldset>
        <div class="company" aria-hidden="true">Company <input name="company" tabindex="-1" autocomplete="off" /></div>
        <button type="submit">Send the confirmation</button>
        <p class="signup-note" id="alert-message" role="status"></p>
        <p class="signup-note" id="alert-pending" hidden>The form is ready. Confirmation emails start once a sending address is connected.</p>
      </form>
    </section>

    <footer id="notes"></footer>
    <p class="status" id="status" role="status"></p>
    <script src="alerts-config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
